services:
  - type: web
    name: learn-language-with-song-api-azhang4216
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci
    startCommand: npm run db:migrate && npm run start:api
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24.11.1
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: learn-language-with-song-db
          property: connectionString
      - key: FRONTEND_ORIGINS
        value: https://azhang4216.github.io
      - key: SESSION_DAYS
        value: 30
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_METADATA_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_LYRICS_MODEL
        value: gpt-5.6-terra

databases:
  - name: learn-language-with-song-db
    plan: free
    region: oregon
    postgresMajorVersion: "18"
    databaseName: verse
    user: verse
    ipAllowList: []
